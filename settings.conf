# Pi-hole settings, applied by `make deploy` with `pihole-FTL --config <key> <value>`.
# These win over changes made in the web UI the next time you deploy.
# Strings are unquoted; arrays use ["a", "b"].
# All keys: https://docs.pi-hole.net/ftldns/configfile/ (or /etc/pihole/pihole.toml on the Pi)

# Upstream resolvers (Cloudflare)
dns.upstreams = ["1.1.1.1", "1.0.0.1"]

# Pi-hole only answers clients on its own subnet by default. If you add VLANs on
# the UDM that should also use it, switch to ALL.
dns.listeningMode = ALL

# Local DNS records ("IP hostname").
# dns.hosts = ["192.168.1.2 pihole.lan", "192.168.1.3 pihole2.lan"]

# Ask the UDM for client hostnames so the query log shows names instead of IPs.
# The last field is the UDM's domain name (Settings > Networks > your network).
# dns.revServers = ["true,192.168.1.0/24,192.168.1.1,localdomain"]
